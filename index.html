<html lang="pt-BR">

    <meta name="theme-color" content="#0D47A1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://conectafina-as.vercel.app/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Apple / iOS -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Conecta Finanças" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <!-- iOS splash screens (portrait) -->
    <style>
      /* Prevent FOUC */
      html { background-color: #FFFFFF; }
      @media (prefers-color-scheme: dark) { html { background-color: #030712; } }
      /* Safe areas for notch devices */
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    </style>
